name: Release

on:
  push:
    branches: [main]
    paths:
      - '.changeset/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/release.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  BUN_VERSION: '1.2.0'

jobs:
  release:
    name: Changesets Release
    runs-on: ubuntu-latest
    env:
      SKIP_SIMPLE_GIT_HOOKS: '1'
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Bun doesn't require cache configuration
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Build packages
        run: bun run build
      
      - name: Run tests
        run: bun run test:ci

      - name: Validate packed internal dependency graph
        run: bun run release:verify:internal-deps

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: bun run changeset:version && bun install
          publish: bun run release:publish
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
