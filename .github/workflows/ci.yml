name: CI

on:
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '24'
  BUN_VERSION: '1.2.0'

jobs:
  release-pr-guard:
    name: Release PR Guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify release PR branch policy
        run: |
          echo "PR branch: ${GITHUB_HEAD_REF}"
          if [ "${GITHUB_HEAD_REF}" = "changeset-release/main" ]; then
            echo "Changeset release PR detected; lightweight CI path enabled."
          else
            echo "Standard PR detected; full CI path enabled."
          fi

  changeset:
    name: Changeset Policy
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Bun doesn't require cache configuration

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Enforce changeset requirement for publishable changes
        run: bun run ci:check-changesets

      - name: Enforce publishable version-line consistency
        run: bun run ci:check-version-line

      - name: Enforce explicit sideEffects declarations
        run: bun run ci:check-side-effects

  readme-version-policy:
    name: README Version Policy
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Bun doesn't require cache configuration

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Enforce package README pinning policy
        run: bun run ci:check-readme-pins

  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Bun doesn't require cache configuration
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Run linter
        run: bun run lint

  typecheck:
    name: Type Check
    if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Bun doesn't require cache configuration
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Build dependencies (needed for type checking)
        run: |
          bun run --filter @tachui/types build
          bun run --filter @tachui/registry build
          bun run build:core
          bun run --filter @tachui/modifiers build
          bun run build:ssr
          bun run build:mobile
          bun run build:flow-control
          bun run build:viewport
          bun run build:primitives
          bun run build:responsive
          bun run build:symbols
          bun run build:devtools
          bun run build:data
          bun run build:forms
          bun run build:navigation
          bun run build:grid
          bun run --filter @tachui/fragments build
          bun run build:query

      - name: Run type checking
        run: bun run type-check

      # Runs here rather than in test:ci because it resolves against built
      # declarations, and this job has already built them. test:ci is also the
      # pre-push gate, which does no build.
      - name: Run type-level tests
        run: bun run test:types

  test:
    name: Test
    if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Bun doesn't require cache configuration
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Build dependencies (needed for tests)
        run: |
          bun run --filter @tachui/types build
          bun run --filter @tachui/registry build
          bun run build:core
          bun run --filter @tachui/modifiers build
          bun run build:ssr
          bun run build:mobile
          bun run build:flow-control
          bun run build:primitives
          bun run build:responsive
          bun run --filter @tachui/fragments build

      - name: Run tests
        run: bun run test:ci
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  build:
    name: Build
    if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Bun doesn't require cache configuration
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Build packages
        run: bun run build
      
      - name: Check for build artifacts
        run: |
          if [ ! -d "packages/core/dist" ]; then
            echo "Core package build failed"
            exit 1
          fi

      - name: Enforce bundle size budgets
        run: bun run ci:check-size-budget

  cli-init-smoke:
    name: CLI Init Packed Smoke
    if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Bun doesn't require cache configuration

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CLI init packed smoke test
        run: ./tools/smoke-cli-init-packed.sh

  docs:
    name: Build Documentation
    if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Bun doesn't require cache configuration
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Build packages (needed for TypeDoc)
        run: bun run build
      
      - name: Build API documentation
        run: bun run docs:api
      
      - name: Build guide documentation
        run: bun run docs:build

  security:
    name: Security Audit
    if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Bun doesn't require cache configuration
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Run dependency security audit
        run: bunx npm audit --audit-level=moderate
        continue-on-error: true

  benchmarks:
    name: Browser Benchmarks
    if: github.event_name != 'pull_request' || github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    needs: [build]
    env:
      TACHUI_BENCH_ITERATIONS: 4
      TACHUI_BENCH_WARMUPS: 1
    steps:
      - uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Bun does not require cache configuration

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser benchmark suite
        run: bun run benchmark:browser:report

      - name: Generate combined benchmark summary
        run: bun run benchmark:report:combined

      - name: Publish benchmark comparison
        run: |
          node -e "const fs=require('fs');const reportPath='benchmarks/history/latest.json';if(!fs.existsSync(reportPath)){console.error('missing benchmark history');process.exit(1);}const data=JSON.parse(fs.readFileSync(reportPath,'utf8'));const summary=data.comparison?.report||'No comparison report generated.';const output=['### Benchmark Comparison','```',summary,'```',''];fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,output.join('\n'));"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            benchmarks/history/*.json
            packages/core/benchmarks/results/browser/*.json
          if-no-files-found: warn
