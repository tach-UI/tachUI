name: Extended Tests

# The test tiers PR CI does not fully cover. They ran nowhere automated until
# #229; a green PR said nothing about them.
#
# Coverage differs per tier, and only stress is exclusive to this workflow:
# memory's ungated suites run in `test:ci` too and the gated ones only here,
# and `packages/cli` runs in a local `test` but in no other CI job.
#
# Nightly rather than per-PR, because these cost minutes rather than the nine
# seconds that bought the slow integration suites a place in `test:ci`. Each
# tier is its own job so one red tier names itself.

on:
  schedule:
    # 07:00 UTC daily — after the working day in every timezone the repo sees.
    - cron: '0 7 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  BUN_VERSION: '1.2.0'

jobs:
  extended:
    name: ${{ matrix.tier }}
    runs-on: ubuntu-latest
    strategy:
      # One red tier should not cancel the others.
      fail-fast: false
      matrix:
        include:
          - tier: stress
            command: bun run test:stress
          - tier: memory
            command: bun run test:memory-leaks
          - tier: cli
            command: bun run --filter @tachui/cli test:ci
    steps:
      - uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The full chain rather than ci.yml's hand-listed subset: the CLI tier
      # scaffolds from built `dist`, and a per-tier build list is one more
      # thing to fall out of date the way the scripts in #229 did.
      - name: Build packages
        run: bun run build

      - name: Run ${{ matrix.tier }} tier
        run: ${{ matrix.command }}
