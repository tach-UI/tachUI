name: benchmark-report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

env:
  NODE_VERSION: '22'
  BUN_VERSION: '1.2.0'

jobs:
  run:
    name: Benchmark Report
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Bun does not require cache configuration

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser benchmark (Chromium)
        run: bun run benchmark:browser:report

      - name: Generate combined benchmark summary
        run: bun run benchmark:report

      - name: Upload benchmark history artefact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-history
          path: benchmarks/history/*.json
